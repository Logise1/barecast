<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriber Goal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-subgoal {
            background: white;
            padding: 20px 30px;
            border-radius: 50px;
            border: 4px solid var(--primary-color);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.1);
            width: 500px;
            transition: transform 0.3s;
        }
        .w-subgoal h3 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }
        .w-subgoal .progress-bar {
            height: 25px;
            background: #e2e8f0;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
        }
        .w-subgoal .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--tech-gold));
            width: 0%;
            transition: width 1s ease-in-out;
        }
        .w-subgoal.celebrating {
            transform: scale(1.1);
            border-color: var(--tech-gold);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        .w-subgoal.celebrating h3 {
            justify-content: center;
            font-size: 2rem;
            color: var(--primary-color);
            text-transform: uppercase;
        }
        .w-subgoal.celebrating .progress-bar,
        .w-subgoal.celebrating .target-label,
        .w-subgoal.celebrating #sg-current-count {
            display: none;
        }
    </style>
</head>
<body class="obs-mode">
    <div id="widget-subgoal" class="obs-widget w-subgoal">
        <div id="sg-current-count" style="text-align:center; font-size:4.5rem; font-weight:800; color:#000; line-height:1; margin-bottom:20px;">0</div>
        <h3 id="sg-header-content">
            <span class="label"><i class="fas fa-star" style="color:var(--tech-gold)"></i> Next Goal</span>
            <span id="sg-text">Loading...</span>
        </h3>
        <div class="progress-bar"><div id="sg-fill" class="fill"></div></div>
        <div class="target-label" style="text-align:right; font-size:0.9rem; margin-top:8px; font-weight:700; color:var(--text-secondary);">
            Target: <span id="sg-target">...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../js/obs.js"></script>
    <script>
        const channelId = requireParam('channelId');
        const step = parseInt(qs('step', '50'), 10) || 50;
        const MIXERNO_API = `https://backend.mixerno.space/api/youtube/estv3/${channelId}`;
        let isCelebrating = false;
        let lastCelebratedCount = 0;

        function triggerCelebration(count) {
            if (isCelebrating) return;
            isCelebrating = true;
            const box = document.getElementById('widget-subgoal');
            const header = document.getElementById('sg-header-content');
            box.classList.add('celebrating');
            header.innerHTML = '🎉 GOAL REACHED! 🎉';
            if (window.confetti) confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => { header.innerHTML = '❤️ THANKS!! ❤️'; }, 3000);
            setTimeout(() => {
                isCelebrating = false;
                box.classList.remove('celebrating');
                header.innerHTML = `
                    <span class="label"><i class="fas fa-star" style="color:var(--tech-gold)"></i> Next Goal</span>
                    <span id="sg-text">${count.toLocaleString()} / ${(count + step).toLocaleString()}</span>
                `;
                document.getElementById('sg-fill').style.width = '0%';
                document.getElementById('sg-target').innerText = (count + step).toLocaleString();
                document.getElementById('sg-current-count').innerText = count.toLocaleString();
            }, 6000);
        }

        async function fetchStats() {
            if (isCelebrating) return;
            try {
                const response = await fetch(MIXERNO_API);
                const data = await response.json();
                if (!data?.items?.length) return;
                const subCount = parseInt(data.items[0].statistics.subscriberCount, 10);
                if (subCount > 0 && subCount % step === 0 && subCount !== lastCelebratedCount) {
                    lastCelebratedCount = subCount;
                    triggerCelebration(subCount);
                    return;
                }
                const currentGoal = Math.ceil((subCount + 0.1) / step) * step;
                const previousGoal = currentGoal - step;
                let percentage = currentGoal > 0 ? Math.min(((subCount - previousGoal) / step) * 100, 100) : 0;
                if (percentage < 0) percentage = 0;
                document.getElementById('sg-fill').style.width = `${percentage}%`;
                document.getElementById('sg-text').innerText = `${subCount.toLocaleString()} / ${currentGoal.toLocaleString()}`;
                document.getElementById('sg-target').innerText = currentGoal.toLocaleString();
                document.getElementById('sg-current-count').innerText = subCount.toLocaleString();
            } catch (e) { console.error(e); }
        }
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
