<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=e4d107cd-8150-4d22-a1da-44e09d690af7
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date & Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-datetime {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .w-datetime .time {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }
        .w-datetime .date {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .w-datetime .timezone {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-secondary);
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-datetime">
        <div id="dt-time" class="time">00:00:00</div>
        <div id="dt-date" class="date">Day, Month 00</div>
        <div id="dt-label" class="timezone">Current UK Time</div>
    </div>
    <script src="../js/obs.js"></script>
    <script>
        const timezone = qs('timezone', 'Europe/London');
        const label = qs('label', 'Current UK Time');
        document.getElementById('dt-label').innerText = label;
        function update() {
            const now = new Date();
            document.getElementById('dt-time').innerText = now.toLocaleTimeString('en-GB', {
                timeZone: timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            document.getElementById('dt-date').innerText = now.toLocaleDateString('en-GB', {
                timeZone: timezone, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
