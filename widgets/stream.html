<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=e4d107cd-8150-4d22-a1da-44e09d690af7
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Stats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-stream {
            background: white;
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            border: 4px solid #F44336;
            box-shadow: 0 10px 40px rgba(244, 67, 54, 0.2);
            max-width: 400px;
            position: relative;
        }
        .live-badge {
            display: inline-block;
            background: #F44336;
            color: white;
            padding: 4px 12px;
            border-radius: 5px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 10px;
            box-shadow: 0 0 10px #F44336;
            animation: pulse 1.5s infinite;
        }
        .w-stream h3 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin: 0 0 15px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .w-stream-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .w-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .w-stat span {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1;
        }
        #sv-viewers { color: #F44336; }
        #sv-likes { color: #2196F3; }
        .w-stat label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .stream-progress {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .stream-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.5s;
        }
        .goal-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-stream">
        <div class="live-badge">🔴 LIVE</div>
        <h3 id="sv-title">Loading live stream...</h3>
        <div class="w-stream-stats">
            <div class="w-stat">
                <span id="sv-viewers">0</span>
                <label><i class="fas fa-eye"></i> Viewers</label>
            </div>
            <div class="w-stat">
                <span id="sv-likes">0</span>
                <label><i class="fas fa-thumbs-up"></i> Likes</label>
            </div>
        </div>
        <div class="stream-goal">
            <div class="stream-progress"><div id="sg-mini-fill" class="stream-fill"></div></div>
            <div class="goal-text">
                <span><i class="fas fa-users"></i> Viewer Goal</span>
                <span><span id="sg-mini-current">0</span> / <span id="sg-mini-target">50</span></span>
            </div>
        </div>
    </div>
    <script src="../js/obs.js"></script>
    <script>
        const videoId = requireParam('videoId');
        async function fetchLiveStats() {
            try {
                const statsResponse = await fetch(`https://mixerno.space/api/youtube-stream-counter/user/${videoId}`);
                const statsData = await statsResponse.json();
                if (!statsData?.counts) return;
                const viewersObj = statsData.counts.find((i) => i.value === 'viewers');
                const likesObj = statsData.counts.find((i) => i.value === 'likes');
                const nameObj = statsData.user?.find((i) => i.value === 'name');
                let viewers = 0;
                if (nameObj) document.getElementById('sv-title').innerText = nameObj.count;
                if (viewersObj?.count) {
                    viewers = parseInt(String(viewersObj.count).replace(/,/g, ''), 10) || 0;
                    document.getElementById('sv-viewers').innerText = viewers.toLocaleString();
                }
                if (likesObj) document.getElementById('sv-likes').innerText = likesObj.count;
                const step = 50;
                const currentGoal = Math.ceil((viewers + 1) / step) * step;
                document.getElementById('sg-mini-fill').style.width = `${Math.min((viewers / currentGoal) * 100, 100)}%`;
                document.getElementById('sg-mini-current').innerText = viewers;
                document.getElementById('sg-mini-target').innerText = currentGoal;
            } catch (e) { console.error(e); }
        }
        fetchLiveStats();
        setInterval(fetchLiveStats, 2000);
    </script>
</body>
</html>
