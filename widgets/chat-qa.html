<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=e4d107cd-8150-4d22-a1da-44e09d690af7
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Chat Q&A</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/chat.css">
    <style>
        .w-qa {
            width: min(440px, 94vw);
            max-height: 70vh;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 16px;
            color: #fff;
        }
        h3 { margin: 0 0 12px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.95rem; }
        .q {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .text { font-weight: 700; line-height: 1.3; }
        .who { color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-qa">
        <h3 id="title">Questions</h3>
        <div id="list"></div>
    </div>
    <script src="../js/obs.js"></script>
    <script src="../js/chat.js"></script>
    <script>
        const videoId = requireParam('videoId');
        const prefix = qs('prefix', '!q');
        document.getElementById('title').textContent = 'Questions · start with ' + prefix;
        const list = document.getElementById('list');
        const max = 6;

        connectYouTubeChat(videoId, {
            onMessage(msg) {
                const raw = String(msg.message || '').trim();
                if (!chatNorm(raw).startsWith(chatNorm(prefix))) return;
                let question = raw.slice(prefix.length).trim();
                if (!question) return;
                const row = document.createElement('div');
                row.className = 'q';
                row.appendChild(avatarEl(msg.author?.image));
                const body = document.createElement('div');
                body.innerHTML = '<div class="text"></div><div class="who"></div>';
                body.querySelector('.text').textContent = '';
                setChatContent(body.querySelector('.text'), question);
                body.querySelector('.who').textContent = msg.author?.name || '';
                row.appendChild(body);
                list.prepend(row);
                while (list.children.length > max) list.removeChild(list.lastChild);
            }
        });
    </script>
</body>
</html>
