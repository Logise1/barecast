<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Route Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-route {
            background: #0f172a !important;
            color: white !important;
            padding: 0 !important;
            border-radius: 20px;
            width: 400px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
            text-align: left;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .route-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            z-index: 0; filter: brightness(0.3);
            transition: background-image 1s ease-in-out;
        }
        .route-content { position: relative; z-index: 1; padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .w-route-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
        .w-route-header i {
            background: rgba(255,255,255,0.2); color: white; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .w-route-header h2 { margin: 0; font-size: 1.6rem; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .w-route-header p { margin: 0; color: rgba(255,255,255,0.7); font-size: 0.8rem; font-weight: 700; }
        .next-stop-highlight {
            background: rgba(212, 36, 38, 0.8); border: 2px solid white; padding: 15px;
            border-radius: 15px; margin-bottom: 20px; text-align: center;
        }
        .next-stop-highlight .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; display: block; margin-bottom: 5px; }
        .next-stop-highlight .city { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 5px; }
        .next-stop-highlight .timer { font-size: 1.2rem; font-weight: 700; color: #ffd700; }
        .sleep-warning { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .sleep-warning h3 { margin: 0 0 10px 0; font-size: 1rem; color: #fbbf24; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .city-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .city-list li { font-size: 0.95rem; font-weight: 600; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
        .city-list li:last-child { border-bottom: none; }
        .city-list li span.time { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-route">
        <div id="route-bg" class="route-bg"></div>
        <div class="route-content">
            <div class="w-route-header">
                <i class="fas fa-sleigh"></i>
                <div>
                    <h2>Santa Tracker</h2>
                    <p>Live Delivery Status</p>
                </div>
            </div>
            <div class="next-stop-highlight">
                <span class="label">Heading To</span>
                <div id="route-next-city" class="city">---</div>
                <div id="route-timer" class="timer">00:00:00</div>
            </div>
            <div class="sleep-warning">
                <h3><i class="fas fa-moon"></i> Sleep Warning!</h3>
                <ul id="city-list" class="city-list"></ul>
            </div>
        </div>
    </div>
    <script src="../js/obs.js"></script>
    <script>
        async function start() {
            const response = await fetch('../route.json');
            const originalRouteData = await response.json();
            const currentYear = new Date().getFullYear();
            const routeData = originalRouteData.map((stop) => {
                const d = new Date(stop.arrival);
                d.setFullYear(currentYear);
                return { ...stop, arrival: d.getTime() };
            });
            const formatTimer = (ms) => {
                if (ms < 0) return '00:00';
                const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((ms % (1000 * 60)) / 1000);
                return `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            };
            const updateRoute = () => {
                const now = getNow();
                let currentStopIndex = -1;
                if (now >= routeData[0].arrival) {
                    for (let i = 0; i < routeData.length; i++) {
                        if (now >= routeData[i].arrival) currentStopIndex = i;
                        else break;
                    }
                }
                const nextCityEl = document.getElementById('route-next-city');
                const timerEl = document.getElementById('route-timer');
                const bgEl = document.getElementById('route-bg');
                const listEl = document.getElementById('city-list');
                let nextStop = null;
                let displayCity = 'North Pole';
                if (currentStopIndex === -1) {
                    displayCity = routeData[0].city;
                    nextStop = routeData[0];
                } else if (currentStopIndex >= routeData.length - 1) {
                    displayCity = 'Home';
                } else {
                    nextStop = routeData[currentStopIndex + 1];
                    displayCity = nextStop.city;
                }
                nextCityEl.innerText = displayCity;
                bgEl.style.backgroundImage = nextStop?.photo_url ? `url('${nextStop.photo_url}')` : 'none';
                timerEl.innerText = nextStop ? formatTimer(nextStop.arrival - now) : 'Done';
                listEl.innerHTML = '';
                let startIndex = currentStopIndex === -1 ? 1 : currentStopIndex + 2;
                let count = 0;
                for (let i = startIndex; i < routeData.length && count < 5; i++) {
                    const stop = routeData[i];
                    const t = stop.arrival - now;
                    let timeStr = formatTimer(t);
                    if (t > 3600000) {
                        const h = Math.floor(t / 3600000);
                        const m = Math.floor((t % 3600000) / 60000);
                        timeStr = `${h}h ${m}m`;
                    }
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${stop.city}</span> <span class="time">${timeStr}</span>`;
                    listEl.appendChild(li);
                    count++;
                }
            };
            setInterval(updateRoute, 1000);
            updateRoute();
        }
        start().catch((e) => console.error('Error loading route:', e));
    </script>
</body>
</html>
