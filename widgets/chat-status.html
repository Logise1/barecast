<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-status {
            background: white;
            padding: 28px 44px;
            border-radius: 20px;
            border: 4px solid var(--primary-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-width: 360px;
            max-width: 640px;
        }
        .w-status h3 {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin: 0 0 8px;
            text-transform: uppercase;
        }
        .w-status h1 {
            color: var(--primary-color);
            font-size: 2.8rem;
            margin: 0;
            font-weight: 800;
            line-height: 1.2;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-status">
        <h3>Current Status</h3>
        <h1 id="status-display">Waiting...</h1>
    </div>
    <script src="../js/obs.js"></script>
    <script src="../js/chat.js"></script>
    <script>
        const videoId = requireParam('videoId');
        const who = qs('who', 'mods');
        const command = chatNorm(qs('command', '!status'));
        const initial = qs('text', 'Waiting...');
        const customNames = qs('usernames', '')
            .split(/[\n,]+/)
            .map((name) => chatNorm(name).replace(/^@/, ''))
            .filter(Boolean);

        const display = document.getElementById('status-display');
        const storageKey = 'chat-status:' + videoId;
        display.textContent = localStorage.getItem(storageKey) || initial;

        function nameKey(author = {}) {
            return chatNorm(author.name || '').replace(/^@/, '');
        }

        function canChange(author = {}) {
            if (who === 'owner') return !!author.owner;
            if (who === 'mods') return !!(author.owner || author.moderator);
            if (who === 'custom') return customNames.includes(nameKey(author));
            return false;
        }

        connectYouTubeChat(videoId, {
            onMessage(msg) {
                if (chatMediaUrl(msg.message)) return;
                const raw = String(msg.message || '').trim();
                const parts = raw.split(/\s+/);
                if (chatNorm(parts[0]) !== command) return;
                if (!canChange(msg.author)) return;
                const next = raw.slice(parts[0].length).trim();
                if (!next) return;
                display.textContent = next;
                try { localStorage.setItem(storageKey, next); } catch (_) {}
            }
        });
    </script>
</body>
</html>
