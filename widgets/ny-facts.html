<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=e4d107cd-8150-4d22-a1da-44e09d690af7
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Facts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .w-ny-facts {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            width: 500px;
            text-align: center;
        }
        .w-ny-facts h3 {
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .w-ny-facts p {
            font-size: 1.3rem;
            line-height: 1.5;
            min-height: 3em;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #e2e8f0;
            font-weight: 500;
        }
        .fact-progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .fact-progress-fill {
            height: 100%;
            background: #ffd700;
            width: 100%;
            border-radius: 3px;
        }
    </style>
</head>
<body class="obs-mode">
    <div class="obs-widget w-ny-facts">
        <h3><i class="fas fa-lightbulb"></i> Did You Know?</h3>
        <p id="fact-text">Loading...</p>
        <div class="fact-progress-container">
            <div id="fact-progress" class="fact-progress-fill"></div>
        </div>
    </div>
    <script>
        const facts = [
            "In Spain, people eat 12 grapes at midnight for luck.",
            "In Scotland, 'Hogmanay' involves swinging fireballs.",
            "In Brazil, people wear white and jump seven waves.",
            "In Japan, temples ring bells 108 times to banish sins.",
            "In Colombia, people run with empty suitcases for travel.",
            "In Denmark, people smash plates on friends' doors.",
            "In Philippines, round fruits represent wealth.",
            "In Greece, an onion is hung on the door for rebirth.",
            "In Estonia, people try to eat 7, 9, or 12 meals.",
            "In Finland, molten tin predicts the future.",
            "In Panama, effigies of famous people are burned.",
            "In South Africa, old furniture is thrown out windows.",
            "In Bolivia, coins are baked into cakes for luck.",
            "In Ecuador, scarecrows are burned at midnight.",
            "In Romania, people wear bear skins and dance.",
            "In Puerto Rico, water is thrown out the window.",
            "In Belgium, children read letters to their parents.",
            "In Switzerland, ice cream is dropped on the floor.",
            "In France, people feast on foie gras and oysters.",
            "In Armenia, 'tarehats' bread is baked with a coin.",
            "In Turkey, pomegranates are smashed for abundance.",
            "In Siberia, divers plant a tree under a frozen lake.",
            "In Ireland, mistletoe is placed under the pillow.",
            "In Germany, 'Dinner for One' is a TV tradition.",
            "In Austria, lead pouring predicts the year ahead.",
            "In Czech Republic, an apple is cut to predict fate.",
            "In Italy, lentils are eaten for wealth and prosperity.",
            "In Netherlands, 'Oliebollen' (doughnuts) are eaten.",
            "In Poland, carp scales are kept in wallets for money.",
            "In Portugal, 12 raisins are eaten at midnight.",
            "In Russia, a wish is written, burned, and drunk.",
            "In Sweden, poem 'Ring Out, Wild Bells' is read.",
            "In UK, 'Auld Lang Syne' is sung at midnight.",
            "In Iceland, bonfires are lit to burn the old year.",
            "In Hungary, frankfurters are eaten for luck.",
            "In Peru, yellow underwear is worn for good luck.",
            "In Chile, people spend the night in cemeteries.",
            "In Singapore, wishes are written on spheres in the river.",
            "In Korea, sunrise festivals are popular.",
            "In Vietnam, the house is cleaned before Tet.",
            "In Thailand, water fights mark Songkran.",
            "In China, red envelopes are given for luck.",
            "In India, colorful rangoli designs decorate floors.",
            "In Iran, 'Haft-Sin' table is set for Nowruz.",
            "In Israel, apples dipped in honey are eaten.",
            "In Saudi Arabia, the new year starts in Muharram.",
            "In Ethiopia, Enkutatash is celebrated in September.",
            "In Canada, the 'Polar Bear Plunge' is tradition.",
            "In USA, the ball drops in Times Square, NYC.",
            "In Mexico, luck is swept into the house."
        ];
        const duration = 20000;
        let currentIndex = 0;
        let startTime = Date.now();
        const textEl = document.getElementById('fact-text');
        const barEl = document.getElementById('fact-progress');
        function update() {
            const now = Date.now();
            let elapsed = now - startTime;
            if (elapsed >= duration) {
                startTime = now;
                elapsed = 0;
                currentIndex = (currentIndex + 1) % facts.length;
                textEl.innerText = facts[currentIndex];
            }
            barEl.style.width = `${((duration - elapsed) / duration) * 100}%`;
            requestAnimationFrame(update);
        }
        textEl.innerText = facts[currentIndex];
        update();
    </script>
</body>
</html>
